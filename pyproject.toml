[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-lens"
version = "0.1.0"
description = "Multimodal Document Auditor & Financial Reconciliation Engine with Human-in-the-Loop Review UX."
readme = "README.md"
authors = [
    { name = "Afsal", email = "afsalkp.mohammed@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.28.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
invoice-lens = "invoice_lens.cli:main"
